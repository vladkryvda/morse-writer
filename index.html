<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CyberMorse">
  <title>RETRO TERMINAL INPUT</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #00ff66;
      font-family: "Courier New", Courier, ui-monospace, monospace;
      overflow: hidden;
      touch-action: none;
    }

    /* Ефект ЕПТ-монітора (Scanlines) */
    .crt-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%),
                  linear-gradient(90deg, rgba(0, 255, 102, 0.03), rgba(0, 0, 0, 0.1), rgba(0, 255, 102, 0.03));
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
      z-index: 20;
    }

    /* Сенсорний шар */
    #touchpad {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 10;
      display: flex;
    }
    .zone { flex: 1; height: 100%; }

    /* Термінал */
    #terminal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 5;
      text-shadow: 0 0 6px rgba(0, 255, 102, 0.6);
    }

    .term-header {
      font-size: 12px;
      color: #009933;
      line-height: 1.4;
      border-bottom: 1px dashed #005522;
      padding-bottom: 8px;
    }

    #console-view {
      flex: 1;
      margin-top: 15px;
      font-size: 26px;
      line-height: 1.4;
      word-break: break-all;
      overflow-y: hidden;
    }

    /* Активна буква під час тапу */
    .active-char {
      background: #00ff66;
      color: #000000;
      padding: 0 2px;
      text-shadow: none;
    }

    /* Миготливий ретро-курсор */
    .cursor {
      display: inline-block;
      width: 14px;
      background-color: #00ff66;
      animation: blink 0.8s infinite;
      vertical-align: baseline;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* Панель живого відслідковування */
    .hud {
      font-size: 14px;
      color: #008833;
      border-top: 1px dashed #005522;
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
    }

    .live-code {
      font-size: 20px;
      color: #00ff66;
      letter-spacing: 4px;
    }

    /* Невидимий чекбокс для активації Taptic Engine на iOS */
    #haptic-holder {
      position: absolute;
      top: -100px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="crt-overlay"></div>

  <div id="haptic-holder">
    <label><input type="checkbox" switch id="iosHaptic"></label>
  </div>

  <div id="terminal">
    <div class="term-header">
      [SYS_READY] LIVE_MORSE_PROTOCOL // V3.2<br>
      STATUS: DIRECT_STREAM &nbsp;|&nbsp; SPEED: REALTIME
    </div>

    <div id="console-view">
      <span id="committed-text">> </span><span id="current-char" class="active-char" style="display:none;"></span><span class="cursor">&nbsp;</span>
    </div>

    <div class="hud">
      <div>CODE: <span id="morse-seq" class="live-code">_</span></div>
      <div id="status-msg">READY</div>
    </div>
  </div>

  <!-- Сенсорний екран -->
  <div id="touchpad">
    <div class="zone" id="zone-left"></div>
    <div class="zone" id="zone-right"></div>
  </div>

  <script>
    // Дерево Морзе (Символ змінюється миттєво з кожним тапом)
    const MORSE_TREE = {
      // 1 рівень
      ".": "E", "-": "T",
      // 2 рівень
      "..": "I", ".-": "A", "-.": "N", "--": "M",
      // 3 рівень
      "...": "S", "..-": "U", ".-.": "R", ".--": "W",
      "-..": "D", "-.-": "K", "--.": "G", "---": "O",
      // 4 рівень
      "....": "H", "...-": "V", "..-.": "F",
      ".-..": "L", ".--.": "P", ".---": "J",
      "-...": "B", "-..-": "X", "-.-.": "C", "-.--": "Y",
      "--..": "Z", "--.-": "Q",
      // Цифри
      ".----": "1", "..---": "2", "...--": "3", "....-": "4", ".....": "5",
      "-....": "6", "--...": "7", "---..": "8", "----.": "9", "-----": "0"
    };

    let buffer = "";
    let committed = "> ";
    let activeChar = "";
    let commitTimer = null;
    let spaceTimer = null;

    const COMMIT_TIMEOUT = 500; // 0.5 с паузи — буква затверджується
    const SPACE_TIMEOUT = 1600;  // 1.6 с паузи — додається пробіл

    // Елементи
    const committedEl = document.getElementById("committed-text");
    const currentCharEl = document.getElementById("current-char");
    const morseSeqEl = document.getElementById("morse-seq");
    const statusMsgEl = document.getElementById("status-msg");
    const hapticSwitch = document.getElementById("iosHaptic");

    // Звук старого термінала (клацання реле)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTerminalClick(freq = 600, duration = 0.015) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // Вібрація (Taptic Engine + Web)
    function triggerHaptic(type = "click") {
      if (navigator.vibrate) {
        navigator.vibrate(type === "commit" ? [25, 40, 25] : 30);
      }
      if (hapticSwitch) hapticSwitch.click();
      playTerminalClick(type === "commit" ? 400 : 800);
    }

    // Миттєва реєстрація тапу
    function handleInput(symbol) {
      clearTimeout(commitTimer);
      clearTimeout(spaceTimer);

      buffer += symbol;
      activeChar = MORSE_TREE[buffer] || "?";

      // МИТТЄВЕ відображення на курсорі
      currentCharEl.style.display = "inline-block";
      currentCharEl.innerText = activeChar;
      morseSeqEl.innerText = buffer;
      statusMsgEl.innerText = "STREAMING...";

      triggerHaptic("click");

      // Таймер фіксації: якщо користувач зупинився — затверджуємо літеру
      commitTimer = setTimeout(() => {
        commitCurrentChar();
      }, COMMIT_TIMEOUT);
    }

    // Затвердження символу
    function commitCurrentChar() {
      if (!activeChar) return;

      committed += activeChar;
      committedEl.innerText = committed;
      
      // Скидання буфера
      buffer = "";
      activeChar = "";
      currentCharEl.style.display = "none";
      currentCharEl.innerText = "";
      morseSeqEl.innerText = "_";
      statusMsgEl.innerText = "LOCKED";

      triggerHaptic("commit");

      // Запуск таймера для пробілу після завершення літери
      spaceTimer = setTimeout(() => {
        committed += " ";
        committedEl.innerText = committed;
        statusMsgEl.innerText = "[SPACE]";
        playTerminalClick(250, 0.03);
      }, SPACE_TIMEOUT - COMMIT_TIMEOUT);
    }

    // Обробка жестів і дотиків
    let startX = 0;
    let startY = 0;
    let startTime = 0;

    window.addEventListener("touchstart", (e) => {
      const touch = e.touches[0];
      startX = touch.clientX;
      startY = touch.clientY;
      startTime = Date.now();

      // Якщо доторкнулись 2 пальцями одразу — це ТИРЕ (-) будь-де
      if (e.touches.length === 2) {
        handleInput("-");
      }
    }, { passive: false });

    window.addEventListener("touchend", (e) => {
      const touch = e.changedTouches[0];
      const deltaX = touch.clientX - startX;
      const deltaY = touch.clientY - startY;
      const duration = Date.now() - startTime;

      // 1. Свайпи
      if (Math.abs(deltaX) > 40 || Math.abs(deltaY) > 40) {
        if (Math.abs(deltaX) > Math.abs(deltaY)) {
          if (deltaX < -40) {
            // Свайп ВЛІВО: Backspace
            if (buffer.length > 0) {
              buffer = "";
              activeChar = "";
              currentCharEl.style.display = "none";
              morseSeqEl.innerText = "_";
            } else if (committed.length > 2) {
              committed = committed.slice(0, -1);
              committedEl.innerText = committed;
            }
            statusMsgEl.innerText = "DEL";
            triggerHaptic();
          } else if (deltaX > 40) {
            // Свайп ВПРАВО: Пробіл
            committed += " ";
            committedEl.innerText = committed;
            statusMsgEl.innerText = "SPACE";
            triggerHaptic();
          }
        } else {
          if (deltaY < -40) {
            // Свайп ВГОРУ: Скопіювати текст
            const textToCopy = committed.replace(/^>\s*/, '');
            if (navigator.clipboard) navigator.clipboard.writeText(textToCopy);
            statusMsgEl.innerText = "COPIED!";
            triggerHaptic("commit");
          } else if (deltaY > 40) {
            // Свайп ВНИЗ: Очистити термінал
            committed = "> ";
            buffer = "";
            activeChar = "";
            currentCharEl.style.display = "none";
            committedEl.innerText = committed;
            morseSeqEl.innerText = "_";
            statusMsgEl.innerText = "CLEARED";
            triggerHaptic();
          }
        }
        return;
      }

      // 2. Тапи одним пальцем
      if (duration < 350) {
        const screenWidth = window.innerWidth;
        if (touch.clientX < screenWidth / 2) {
          handleInput("."); // Ліва половина = Крапка
        } else {
          handleInput("-"); // Права половина = Тире
        }
      }
    }, { passive: false });
  </script>
</body>
</html>
