<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>IAMBIC_PADDLE_TERMINAL</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #00ff66;
      font-family: "Courier New", Courier, monospace;
      overflow: hidden;
      touch-action: none;
    }

    /* Фонова шпаргалка Морзе (Ретро-водяний знак) */
    #morse-cheat-sheet {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px 4px;
      padding: 70px 16px 80px 16px;
      font-size: 13px;
      color: rgba(0, 255, 102, 0.15); /* Тьмяний зелений фосфор */
      pointer-events: none;
      z-index: 1;
      text-align: center;
      line-height: 1.3;
    }

    /* Візуальний розділювач зон екрана */
    #split-visual {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      pointer-events: none;
      z-index: 2;
    }
    .pad-left, .pad-right {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      color: rgba(0, 255, 102, 0.04);
      font-weight: bold;
    }
    .pad-left {
      border-right: 1px dashed rgba(0, 255, 102, 0.12);
    }

    /* Головний контейнер термінала */
    #terminal-ui {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 5;
      text-shadow: 0 0 6px rgba(0, 255, 102, 0.6);
      pointer-events: none; /* Щоб тапи проходили на сенсорний шар */
    }

    .header {
      font-size: 11px;
      color: #008833;
      border-bottom: 1px dashed #004411;
      padding-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    #stream-box {
      flex: 1;
      margin-top: 15px;
      font-size: 26px;
      line-height: 1.4;
      word-break: break-all;
    }

    /* Буква, яка зараз збирається на очах */
    .active-glyph {
      background: #00ff66;
      color: #000000;
      padding: 0 4px;
      font-weight: bold;
      text-shadow: none;
    }

    .cursor {
      display: inline-block;
      width: 12px;
      background-color: #00ff66;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .footer {
      border-top: 1px dashed #004411;
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .morse-live {
      font-size: 26px;
      color: #00ff66;
      letter-spacing: 5px;
      font-weight: bold;
    }

    /* Спалах рамки при тапі */
    #frame-border {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border: 2px solid transparent;
      pointer-events: none;
      z-index: 10;
      transition: border-color 0.08s ease;
    }
    .flash {
      border-color: #00ff66 !important;
    }
  </style>
</head>
<body>

  <!-- Спалах рамки -->
  <div id="frame-border"></div>

  <!-- Фонові підказки зон: Ліво · / Право — -->
  <div id="split-visual">
    <div class="pad-left">·</div>
    <div class="pad-right">—</div>
  </div>

  <!-- Фонова шпаргалка Морзе -->
  <div id="morse-cheat-sheet">
    <div>A ·—</div><div>B —···</div><div>C —·—·</div><div>D —··</div>
    <div>E ·</div><div>F ··—·</div><div>G ——·</div><div>H ····</div>
    <div>I ··</div><div>J ·———</div><div>K —·—</div><div>L ·—··</div>
    <div>M ——</div><div>N —·</div><div>O ———</div><div>P ·——·</div>
    <div>Q ——·—</div><div>R ·—·</div><div>S ···</div><div>T —</div>
    <div>U ··—</div><div>V ···—</div><div>W ·——</div><div>X —··—</div>
    <div>Y —·——</div><div>Z ——··</div><div>1 ·————</div><div>2 ··———</div>
    <div>3 ···——</div><div>4 ····—</div><div>5 ·····</div><div>0 —————</div>
  </div>

  <!-- Інтерфейс термінала -->
  <div id="terminal-ui">
    <div class="header">
      <span>[PADDLE_MODE] L: · | R: —</span>
      <span>SWIPE ←: DEL</span>
    </div>

    <div id="stream-box">
      <span id="text">> </span><span id="active" class="active-glyph" style="display:none;"></span><span class="cursor">&nbsp;</span>
    </div>

    <div class="footer">
      <div>CODE: <span id="code-view" class="morse-live">_</span></div>
      <div id="status" style="color: #00aa44;">READY</div>
    </div>
  </div>

  <script>
    const MORSE = {
      ".": "E", "-": "T",
      "..": "I", ".-": "A", "-.": "N", "--": "M",
      "...": "S", "..-": "U", ".-.": "R", ".--": "W",
      "-..": "D", "-.-": "K", "--.": "G", "---": "O",
      "....": "H", "...-": "V", "..-.": "F",
      ".-..": "L", ".--.": "P", ".---": "J",
      "-...": "B", "-..-": "X", "-.-.": "C", "-.--": "Y",
      "--..": "Z", "--.-": "Q",
      ".----": "1", "..---": "2", "...--": "3", "....-": "4", ".....": "5",
      "-....": "6", "--...": "7", "---..": "8", "----.": "9", "-----": "0"
    };

    let buffer = "";
    let committed = "> ";
    let activeChar = "";
    let letterTimer = null;
    let spaceTimer = null;

    const LETTER_TIMEOUT = 450; // 0.45 с паузи — буква фіксується
    const SPACE_TIMEOUT = 1200;  // 1.20 с після літери — авто-пробіл

    const textEl = document.getElementById("text");
    const activeEl = document.getElementById("active");
    const codeEl = document.getElementById("code-view");
    const statusEl = document.getElementById("status");
    const frameEl = document.getElementById("frame-border");

    // Тактильний сигнал (вібрація)
    function triggerHaptic(type = "normal") {
      try {
        if (navigator.vibrate) {
          navigator.vibrate(type === "space" ? [20, 40, 20] : 25);
        }
      } catch(e) {}
      frameEl.classList.add("flash");
      setTimeout(() => frameEl.classList.remove("flash"), 70);
    }

    // Реєстрація крапки чи тире
    function inputSymbol(sym) {
      clearTimeout(letterTimer);
      clearTimeout(spaceTimer);
      triggerHaptic("normal");

      buffer += sym;
      activeChar = MORSE[buffer] || "?";

      // Миттєве відображення трансформації літери на курсорі
      activeEl.style.display = "inline-block";
      activeEl.innerText = activeChar;
      codeEl.innerText = buffer;
      statusEl.innerText = "STREAM";

      // Запуск таймера завершення літери
      letterTimer = setTimeout(commitLetter, LETTER_TIMEOUT);
    }

    // Фіксація поточної літери
    function commitLetter() {
      if (!activeChar) return;

      committed += activeChar;
      textEl.innerText = committed;

      buffer = "";
      activeChar = "";
      activeEl.style.display = "none";
      codeEl.innerText = "_";
      statusEl.innerText = "LOCKED";

      // Запуск таймера авто-пробілу
      spaceTimer = setTimeout(() => {
        committed += " ";
        textEl.innerText = committed;
        statusEl.innerText = "[SPACE]";
        triggerHaptic("space");
      }, SPACE_TIMEOUT);
    }

    // Видалення символу жестом свайпу
    function deleteChar() {
      clearTimeout(letterTimer);
      clearTimeout(spaceTimer);

      if (buffer.length > 0) {
        // Якщо незакінчена буква в процесі — скидаємо її
        buffer = "";
        activeChar = "";
        activeEl.style.display = "none";
        codeEl.innerText = "_";
      } else if (committed.length > 2) {
        // Якщо буфер порожній — видаляємо останній записаний символ
        committed = committed.slice(0, -1);
        textEl.innerText = committed;
      }
      statusEl.innerText = "DEL";
      triggerHaptic("normal");
    }

    // --- ОБРОБКА СЕНСОРА: ТАПИ ЛІВО/ПРАВО ТА СВАЙП ВЛІВО ---
    let startX = 0;
    let startY = 0;

    window.addEventListener("touchstart", function(e) {
      e.preventDefault();
      const t = e.touches[0];
      startX = t.clientX;
      startY = t.clientY;
    }, { passive: false });

    window.addEventListener("touchend", function(e) {
      e.preventDefault();
      const t = e.changedTouches[0];
      const dx = t.clientX - startX;
      const dy = t.clientY - startY;

      // 1. ПЕРЕВІРКА НА СВАЙП ВЛІВО (СТЕРТИ)
      if (dx < -40 && Math.abs(dx) > Math.abs(dy)) {
        deleteChar();
        return;
      }

      // 2. ІНАКШЕ ЦЕ ТАП: ДІЛИМО ЕКРАН ПО ВЕРТИКАЛІ
      const screenWidth = window.innerWidth;
      if (t.clientX < screenWidth / 2) {
        inputSymbol("."); // Ліва частина = КРАПКА
      } else {
        inputSymbol("-"); // Права частина = ТИРЕ
      }
    }, { passive: false });
  </script>
</body>
</html>
