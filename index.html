<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>FAST_MORSE_TERMINAL</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #00ff66;
      font-family: "Courier New", Courier, monospace;
      overflow: hidden;
      touch-action: none;
    }

    #app {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 16px;
      border: 2px solid #002211;
      transition: border-color 0.08s ease;
    }

    .flash {
      border-color: #00ff66 !important;
    }

    /* Верхня панель */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed #004411;
      padding-bottom: 8px;
      font-size: 11px;
    }

    .mode-btn {
      background: #002211;
      color: #00ff66;
      border: 1px solid #00ff66;
      padding: 4px 10px;
      font-family: monospace;
      font-size: 12px;
      border-radius: 4px;
    }

    /* Поле тексту термінала */
    #text-view {
      flex: 1;
      margin-top: 15px;
      font-size: 26px;
      line-height: 1.4;
      word-break: break-all;
    }

    .morph-char {
      background: #00ff66;
      color: #000000;
      padding: 0 4px;
      font-weight: bold;
    }

    .cursor {
      display: inline-block;
      width: 12px;
      background-color: #00ff66;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* Візуальні підказки для спліт-режиму */
    #split-guide {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: none;
      pointer-events: none;
      z-index: 2;
    }
    .split-left, .split-right {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: rgba(0, 255, 102, 0.06);
      font-weight: bold;
    }
    .split-left { border-right: 1px dashed rgba(0, 255, 102, 0.1); }

    /* Нижня панель */
    .bottom-bar {
      border-top: 1px dashed #004411;
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .morse-live {
      font-size: 24px;
      color: #00ff66;
      font-weight: bold;
      letter-spacing: 4px;
    }

    .quick-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      background: transparent;
      border: 1px solid #005522;
      color: #00aa44;
      padding: 6px 12px;
      font-family: monospace;
      font-size: 11px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <!-- Напрямні для спліт-режиму -->
  <div id="split-guide">
    <div class="split-left">·</div>
    <div class="split-right">—</div>
  </div>

  <div id="app">
    <div class="top-bar">
      <span id="hint">ТАП = [ · ] | ШТРИХ = [ — ]</span>
      <button class="mode-btn" id="toggle-mode" onclick="switchMode(event)">MODE: FLICK</button>
    </div>

    <div id="text-view">
      <span id="text">> </span><span id="active" class="morph-char" style="display:none;"></span><span class="cursor">&nbsp;</span>
    </div>

    <div class="bottom-bar">
      <div>CODE: <span id="morse-buf" class="morse-live">_</span></div>
      <div class="quick-actions">
        <button class="action-btn" onclick="addSpace(event)">ПРОБІЛ</button>
        <button class="action-btn" onclick="backspace(event)">СТЕРТИ</button>
        <button class="action-btn" onclick="copyAll(event)">КОПІЯ</button>
      </div>
    </div>
  </div>

  <script>
    // Таблиця Морзе
    const MORSE = {
      ".": "E", "-": "T",
      "..": "I", ".-": "A", "-.": "N", "--": "M",
      "...": "S", "..-": "U", ".-.": "R", ".--": "W",
      "-..": "D", "-.-": "K", "--.": "G", "---": "O",
      "....": "H", "...-": "V", "..-.": "F",
      ".-..": "L", ".--.": "P", ".---": "J",
      "-...": "B", "-..-": "X", "-.-.": "C", "-.--": "Y",
      "--..": "Z", "--.-": "Q",
      ".----": "1", "..---": "2", "...--": "3", "....-": "4", ".....": "5",
      "-....": "6", "--...": "7", "---..": "8", "----.": "9", "-----": "0"
    };

    let mode = "FLICK"; // "FLICK" або "SPLIT"
    let buffer = "";
    let committed = "> ";
    let activeChar = "";
    let commitTimer = null;

    const COMMIT_DELAY = 450; // Пауза для фіксації літери (мс)

    const appEl = document.getElementById("app");
    const textEl = document.getElementById("text");
    const activeEl = document.getElementById("active");
    const morseBufEl = document.getElementById("morse-buf");
    const hintEl = document.getElementById("hint");
    const modeBtn = document.getElementById("toggle-mode");
    const splitGuide = document.getElementById("split-guide");

    // Перемикання режимів
    function switchMode(e) {
      if (e) e.stopPropagation();
      if (mode === "FLICK") {
        mode = "SPLIT";
        modeBtn.innerText = "MODE: SPLIT";
        hintEl.innerText = "ЛІВО = [ · ] | ПРАВО = [ — ]";
        splitGuide.style.display = "flex";
      } else {
        mode = "FLICK";
        modeBtn.innerText = "MODE: FLICK";
        hintEl.innerText = "ТАП = [ · ] | ШТРИХ = [ — ]";
        splitGuide.style.display = "none";
      }
      triggerHaptic();
    }

    function triggerHaptic() {
      try {
        if (navigator.vibrate) navigator.vibrate(20);
      } catch(e) {}
      appEl.classList.add("flash");
      setTimeout(() => appEl.classList.remove("flash"), 60);
    }

    // Реєстрація символу
    function inputSymbol(sym) {
      clearTimeout(commitTimer);
      triggerHaptic();

      buffer += sym;
      activeChar = MORSE[buffer] || "?";

      activeEl.style.display = "inline-block";
      activeEl.innerText = activeChar;
      morseBufEl.innerText = buffer;

      // Літера фіксується через 450 мс
      commitTimer = setTimeout(commitLetter, COMMIT_DELAY);
    }

    function commitLetter() {
      if (!activeChar) return;
      committed += activeChar;
      textEl.innerText = committed;

      buffer = "";
      activeChar = "";
      activeEl.style.display = "none";
      morseBufEl.innerText = "_";
    }

    // Кнопки дій
    function addSpace(e) {
      if (e) e.stopPropagation();
      commitLetter();
      committed += " ";
      textEl.innerText = committed;
      triggerHaptic();
    }

    function backspace(e) {
      if (e) e.stopPropagation();
      if (buffer.length > 0) {
        buffer = "";
        activeChar = "";
        activeEl.style.display = "none";
        morseBufEl.innerText = "_";
      } else if (committed.length > 2) {
        committed = committed.slice(0, -1);
        textEl.innerText = committed;
      }
      triggerHaptic();
    }

    function copyAll(e) {
      if (e) e.stopPropagation();
      const raw = committed.replace(/^>\s*/, '');
      if (navigator.clipboard) navigator.clipboard.writeText(raw);
      triggerHaptic();
    }

    // --- ОБРОБКА ДОТИКІВ (МИТТЄВА, БЕЗ ЗАТРИМОК) ---
    let startX = 0;
    let startY = 0;

    window.addEventListener("touchstart", function(e) {
      if (e.target.tagName === "BUTTON") return;
      e.preventDefault();

      const t = e.touches[0];
      startX = t.clientX;
      startY = t.clientY;
    }, { passive: false });

    window.addEventListener("touchend", function(e) {
      if (e.target.tagName === "BUTTON") return;
      e.preventDefault();

      const t = e.changedTouches[0];
      const dx = t.clientX - startX;
      const dy = t.clientY - startY;
      const dist = Math.hypot(dx, dy);

      if (mode === "FLICK") {
        // РЕЖИМ 1: ТАП ПРОТИ ШТРИХА
        if (dist < 20) {
          // Палець не рухався -> ТАП = КРАПКА
          inputSymbol(".");
        } else {
          // Палець зробив мікро-штрих у будь-який бік -> ШТРИХ = ТИРЕ
          inputSymbol("-");
        }
      } else {
        // РЕЖИМ 2: СПЛІТ (ЛІВО / ПРАВО)
        const screenWidth = window.innerWidth;
        if (t.clientX < screenWidth / 2) {
          inputSymbol("."); // Ліва половина = КРАПКА
        } else {
          inputSymbol("-"); // Права половина = ТИРЕ
        }
      }
    }, { passive: false });
  </script>
</body>
</html>
