<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>CYBER_TELEGRAPH</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #00ff66;
      font-family: "Courier New", Courier, monospace;
      overflow: hidden;
      touch-action: none;
    }

    #terminal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 2px solid #002211;
      transition: border-color 0.1s ease;
    }

    /* Рамка спалахує при дотику */
    .touching {
      border-color: #00ff66 !important;
    }

    .header {
      font-size: 11px;
      color: #008833;
      border-bottom: 1px dashed #004411;
      padding-bottom: 8px;
      line-height: 1.4;
    }

    #stream-view {
      flex: 1;
      margin-top: 15px;
      font-size: 26px;
      line-height: 1.4;
      word-break: break-all;
    }

    .active-char {
      background: #00ff66;
      color: #000000;
      padding: 0 4px;
      font-weight: bold;
    }

    .cursor {
      display: inline-block;
      width: 12px;
      background-color: #00ff66;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .footer {
      border-top: 1px dashed #004411;
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .morse-live {
      font-size: 22px;
      color: #00ff66;
      font-weight: bold;
      letter-spacing: 4px;
    }

    #error-log {
      color: #ff3333;
      font-size: 11px;
      margin-top: 5px;
      display: none;
    }
  </style>
</head>
<body>

  <div id="terminal">
    <div class="header">
      [TACTILE_TELEGRAPH] // SYSTEM READY<br>
      TAP = [ · ] &nbsp;|&nbsp; HOLD (0.2s) = [ — ]<br>
      SWIPE: ← DEL | → SPACE | ↑ COPY
      <div id="error-log"></div>
    </div>

    <div id="stream-view">
      <span id="text">> </span><span id="active" class="active-char" style="display:none;"></span><span class="cursor">&nbsp;</span>
    </div>

    <div class="footer">
      <div>BUF: <span id="morse-buf" class="morse-live">_</span></div>
      <div id="status" style="color: #008833;">WAITING</div>
    </div>
  </div>

  <script>
    // Вивід помилок прямо на екран (якщо щось станеться)
    window.onerror = function(msg, url, line) {
      const errEl = document.getElementById("error-log");
      errEl.style.display = "block";
      errEl.innerText = "ERR: " + msg + " (line " + line + ")";
    };

    // Азбука Морзе
    const MORSE = {
      ".": "E", "-": "T",
      "..": "I", ".-": "A", "-.": "N", "--": "M",
      "...": "S", "..-": "U", ".-.": "R", ".--": "W",
      "-..": "D", "-.-": "K", "--.": "G", "---": "O",
      "....": "H", "...-": "V", "..-.": "F",
      ".-..": "L", ".--.": "P", ".---": "J",
      "-...": "B", "-..-": "X", "-.-.": "C", "-.--": "Y",
      "--..": "Z", "--.-": "Q",
      ".----": "1", "..---": "2", "...--": "3", "....-": "4", ".....": "5",
      "-....": "6", "--...": "7", "---..": "8", "----.": "9", "-----": "0"
    };

    let buffer = "";
    let committed = "> ";
    let activeChar = "";
    let commitTimer = null;

    const HOLD_TIME = 220;   // Поріг затискання для тире (мс)
    const COMMIT_TIME = 500; // Пауза для фіксації букви (мс)

    const termEl = document.getElementById("terminal");
    const textEl = document.getElementById("text");
    const activeEl = document.getElementById("active");
    const morseBufEl = document.getElementById("morse-buf");
    const statusEl = document.getElementById("status");

    // Безпечний виклик тактильного сигналу
    function triggerHaptic(isStrong) {
      try {
        if (navigator.vibrate) {
          navigator.vibrate(isStrong ? 45 : 20);
        }
      } catch(e) {}
    }

    // Реєстрація символу
    function inputSymbol(sym) {
      clearTimeout(commitTimer);

      buffer += sym;
      activeChar = MORSE[buffer] || "?";

      activeEl.style.display = "inline-block";
      activeEl.innerText = activeChar;
      morseBufEl.innerText = buffer;
      statusEl.innerText = "TYPING...";

      triggerHaptic(sym === "-");

      commitTimer = setTimeout(commitLetter, COMMIT_TIME);
    }

    // Фіксація літери
    function commitLetter() {
      if (!activeChar) return;

      committed += activeChar;
      textEl.innerText = committed;

      buffer = "";
      activeChar = "";
      activeEl.style.display = "none";
      morseBufEl.innerText = "_";
      statusEl.innerText = "SAVED";

      triggerHaptic(true);
    }

    // Сенсорні змінні
    let touchTimer = null;
    let isHoldTriggered = false;
    let startX = 0;
    let startY = 0;
    let isMoved = false;

    // 1. Початок торкання
    window.addEventListener("touchstart", function(e) {
      e.preventDefault(); // Блокуємо системні жести Safari (лупу, виділення)
      termEl.classList.add("touching");

      const t = e.touches[0];
      startX = t.clientX;
      startY = t.clientY;
      isMoved = false;
      isHoldTriggered = false;

      clearTimeout(touchTimer);

      // Запускаємо таймер затискання (тире)
      touchTimer = setTimeout(function() {
        if (!isMoved) {
          isHoldTriggered = true;
          inputSymbol("-"); // Зафіксовано ТИРЕ
        }
      }, HOLD_TIME);
    }, { passive: false });

    // 2. Рух пальця (для свайпів)
    window.addEventListener("touchmove", function(e) {
      e.preventDefault();
      const t = e.touches[0];
      const dx = t.clientX - startX;
      const dy = t.clientY - startY;

      if (Math.hypot(dx, dy) > 25) {
        isMoved = true;
        clearTimeout(touchTimer);
      }
    }, { passive: false });

    // 3. Відпускання пальця
    window.addEventListener("touchend", function(e) {
      e.preventDefault();
      termEl.classList.remove("touching");
      clearTimeout(touchTimer);

      // Обробка жестів
      if (isMoved) {
        const t = e.changedTouches[0];
        const dx = t.clientX - startX;
        const dy = t.clientY - startY;

        if (Math.abs(dx) > Math.abs(dy)) {
          if (dx > 40) {
            // Свайп вправо: ПРОБІЛ
            commitLetter();
            committed += " ";
            textEl.innerText = committed;
            statusEl.innerText = "[SPACE]";
            triggerHaptic(false);
          } else if (dx < -40) {
            // Свайп вліво: BACKSPACE
            if (buffer.length > 0) {
              buffer = "";
              activeChar = "";
              activeEl.style.display = "none";
              morseBufEl.innerText = "_";
            } else if (committed.length > 2) {
              committed = committed.slice(0, -1);
              textEl.innerText = committed;
            }
            statusEl.innerText = "DELETE";
            triggerHaptic(false);
          }
        } else {
          if (dy < -40) {
            // Свайп вгору: КОПІЮВАТИ
            const raw = committed.replace(/^>\s*/, '');
            if (navigator.clipboard) navigator.clipboard.writeText(raw);
            statusEl.innerText = "COPIED!";
            triggerHaptic(true);
          } else if (dy > 40) {
            // Свайп вниз: ОЧИСТИТИ
            committed = "> ";
            buffer = "";
            activeChar = "";
            activeEl.style.display = "none";
            textEl.innerText = committed;
            morseBufEl.innerText = "_";
            statusEl.innerText = "CLEARED";
            triggerHaptic(false);
          }
        }
        return;
      }

      // Якщо тире вже спрацювало від затискання — нічого не робимо
      if (isHoldTriggered) return;

      // Короткий швидкий тап — КРАПКА
      inputSymbol(".");
    }, { passive: false });

    // Якщо дотик перервано системою
    window.addEventListener("touchcancel", function() {
      termEl.classList.remove("touching");
      clearTimeout(touchTimer);
    });
  </script>
</body>
</html>
