<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>CYBER_TELEGRAPH</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #00ff66;
      font-family: "Courier New", Courier, monospace;
      overflow: hidden;
      touch-action: none;
    }

    /* Ретро-сканлайни монітора */
    .crt {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%),
                  linear-gradient(90deg, rgba(0, 255, 102, 0.02), rgba(0, 0, 0, 0.1), rgba(0, 255, 102, 0.02));
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
      z-index: 20;
    }

    /* Термінал */
    #terminal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 5;
      text-shadow: 0 0 6px rgba(0, 255, 102, 0.5);
    }

    .header {
      font-size: 11px;
      color: #008833;
      border-bottom: 1px solid #004411;
      padding-bottom: 6px;
      letter-spacing: 1px;
    }

    #stream-view {
      flex: 1;
      margin-top: 20px;
      font-size: 26px;
      line-height: 1.5;
      word-break: break-all;
    }

    /* Активна буква, яка зараз формується */
    .morph-char {
      background: #00ff66;
      color: #000000;
      padding: 0 3px;
      font-weight: bold;
      text-shadow: none;
    }

    .cursor {
      display: inline-block;
      width: 14px;
      background-color: #00ff66;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .footer {
      border-top: 1px solid #004411;
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #00aa44;
    }

    .morse-code {
      font-size: 22px;
      color: #00ff66;
      letter-spacing: 4px;
      font-weight: bold;
    }

    /* Спеціальний перемикач iOS для Taptic Engine */
    #haptic-holder {
      position: absolute;
      top: -100px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="crt"></div>

  <div id="haptic-holder">
    <label><input type="checkbox" switch id="iosHaptic"></label>
  </div>

  <div id="terminal">
    <div class="header">
      [TACTILE_TELEGRAPH] // READY<br>
      TAP = [ · ] &nbsp;|&nbsp; HOLD(0.2s) = [ — ]
    </div>

    <div id="stream-view">
      <span id="text">> </span><span id="active" class="morph-char" style="display:none;"></span><span class="cursor">&nbsp;</span>
    </div>

    <div class="footer">
      <div>BUF: <span id="code" class="morse-code">_</span></div>
      <div id="status">IDLE</div>
    </div>
  </div>

  <script>
    // Дерево символів
    const MORSE = {
      ".": "E", "-": "T",
      "..": "I", ".-": "A", "-.": "N", "--": "M",
      "...": "S", "..-": "U", ".-.": "R", ".--": "W",
      "-..": "D", "-.-": "K", "--.": "G", "---": "O",
      "....": "H", "...-": "V", "..-.": "F",
      ".-..": "L", ".--.": "P", ".---": "J",
      "-...": "B", "-..-": "X", "-.-.": "C", "-.--": "Y",
      "--..": "Z", "--.-": "Q",
      ".----": "1", "..---": "2", "...--": "3", "....-": "4", ".....": "5",
      "-....": "6", "--...": "7", "---..": "8", "----.": "9", "-----": "0"
    };

    let buffer = "";
    let committed = "> ";
    let activeChar = "";
    let commitTimer = null;

    const HOLD_THRESHOLD = 200; // 200 мс — поріг між крапкою і тире
    const COMMIT_DELAY = 500;   // 500 мс паузи — буква фіксується

    const textEl = document.getElementById("text");
    const activeEl = document.getElementById("active");
    const codeEl = document.getElementById("code");
    const statusEl = document.getElementById("status");
    const hapticSwitch = document.getElementById("iosHaptic");

    // Синтезатор звуку для тактильного клацання
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function clickSound(freq = 600, dur = 0.015) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    }

    // Вібрація
    function triggerHaptic(strong = false) {
      if (navigator.vibrate) navigator.vibrate(strong ? 50 : 25);
      if (hapticSwitch) hapticSwitch.click();
      clickSound(strong ? 350 : 750, strong ? 0.03 : 0.015);
    }

    // Додавання символу (.) чи (-)
    function addSymbol(sym) {
      clearTimeout(commitTimer);

      buffer += sym;
      activeChar = MORSE[buffer] || "?";

      // Миттєве відображення літери
      activeEl.style.display = "inline-block";
      activeEl.innerText = activeChar;
      codeEl.innerText = buffer;
      statusEl.innerText = "TYPING...";

      // Запуск таймера фіксації літери
      commitTimer = setTimeout(commitLetter, COMMIT_DELAY);
    }

    // Фіксація поточної літери
    function commitLetter() {
      if (!activeChar) return;

      committed += activeChar;
      textEl.innerText = committed;

      buffer = "";
      activeChar = "";
      activeEl.style.display = "none";
      codeEl.innerText = "_";
      statusEl.innerText = "SAVED";

      triggerHaptic(true);
    }

    // --- ОБРОБКА ДОТИКІВ (БЕЗ ЗБОЇВ) ---
    let touchTimer = null;
    let isHold = false;
    let startX = 0;
    let startY = 0;
    let hasMoved = false;

    window.addEventListener("touchstart", (e) => {
      // Працюємо строго з 1 головним дотиком
      if (e.touches.length > 1) return;

      const t = e.touches[0];
      startX = t.clientX;
      startY = t.clientY;
      hasMoved = false;
      isHold = false;

      // Запускаємо таймер затискання (тире)
      touchTimer = setTimeout(() => {
        if (!hasMoved) {
          isHold = true;
          triggerHaptic(true); // ЧІТКИЙ СИГНАЛ ПІД ПАЛЕЦЬ: ТИРЕ ЗАСХВАЛЕНО
          addSymbol("-");
        }
      }, HOLD_THRESHOLD);
    }, { passive: false });

    window.addEventListener("touchmove", (e) => {
      const t = e.touches[0];
      const dx = t.clientX - startX;
      const dy = t.clientY - startY;

      // Якщо палець посунувся далі 20px — це жест (скасовуємо тап/тире)
      if (Math.hypot(dx, dy) > 20) {
        hasMoved = true;
        clearTimeout(touchTimer);
      }
    }, { passive: false });

    window.addEventListener("touchend", (e) => {
      clearTimeout(touchTimer);

      // Якщо це був свайп
      if (hasMoved) {
        const t = e.changedTouches[0];
        const dx = t.clientX - startX;
        const dy = t.clientY - startY;

        if (Math.abs(dx) > Math.abs(dy)) {
          if (dx > 40) {
            // Свайп вправо: ПРОБІЛ
            commitLetter();
            committed += " ";
            textEl.innerText = committed;
            statusEl.innerText = "[SPACE]";
            triggerHaptic(false);
          } else if (dx < -40) {
            // Свайп вліво: BACKSPACE
            if (buffer.length > 0) {
              buffer = "";
              activeChar = "";
              activeEl.style.display = "none";
              codeEl.innerText = "_";
            } else if (committed.length > 2) {
              committed = committed.slice(0, -1);
              textEl.innerText = committed;
            }
            statusEl.innerText = "DELETE";
            triggerHaptic(false);
          }
        } else {
          if (dy < -40) {
            // Свайп вгору: Скопіювати текст
            const raw = committed.replace(/^>\s*/, '');
            if (navigator.clipboard) navigator.clipboard.writeText(raw);
            statusEl.innerText = "COPIED!";
            triggerHaptic(true);
          } else if (dy > 40) {
            // Свайп вниз: Очистити все
            committed = "> ";
            buffer = "";
            activeChar = "";
            activeEl.style.display = "none";
            textEl.innerText = committed;
            codeEl.innerText = "_";
            statusEl.innerText = "CLEARED";
            triggerHaptic(false);
          }
        }
        return;
      }

      // Якщо тире вже спрацювало від затискання — нічого не робимо
      if (isHold) return;

      // Інакше це був короткий швидкий тап — реєструємо КРАПКУ
      triggerHaptic(false);
      addSymbol(".");
    }, { passive: false });
  </script>
</body>
</html>
